<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود برگزارکنندگان — جریان</title>
  <meta name="theme-color" content="#06142b">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="gate">
    <svg class="gate__trace" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 80h120l30 30h90l30-30h130" opacity=".5"/>
        <path d="M0 200h80l40 40h160l40-40h80" opacity=".35"/>
        <path d="M0 320h160l30-30h60l30 30h120" opacity=".5"/>
      </g>
      <g fill="#06142b" stroke="currentColor" stroke-width="2"><circle cx="120" cy="80" r="6"/><circle cx="270" cy="80" r="6"/><circle cx="120" cy="240" r="6"/><circle cx="280" cy="240" r="6"/><circle cx="160" cy="320" r="6"/><circle cx="250" cy="290" r="6"/></g>
    </svg>
    <section class="gate__card" aria-labelledby="t">
      <img class="gate__logo" src="../assets/logo-jaryan.svg" alt="جریان" width="120" height="57">
      <h1 id="t">ورود برگزارکنندگان</h1>
      <p class="gate__sub">این بخش فقط برای ستاد برگزاری اردو است.</p>
      <form id="f" novalidate>
        <div class="fld">
          <label for="u">نام‌کاربری</label>
          <input id="u" name="username" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="fld">
          <label for="p">رمز عبور</label>
          <input id="p" name="password" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <p class="msg" id="m" role="alert" hidden></p>
        <button class="go" id="b" type="submit">ورود به پنل</button>
      </form>
      <a class="back" href="../">بازگشت به صفحه ثبت‌نام</a>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/gas-adapter.js"></script>
  <script src="login.js"></script>
</body>
</html>
